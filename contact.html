<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RentAttire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">RentAttire</a>
            <button class="hamburger" id="hamburger">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Collection</a>
                <a href="about.html">About</a>
                <a href="contact.html" style="color:var(--gold);">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="cart.html">Cart <span id="cartCount" class="badge badge-available">0</span></a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="section-title text-center">Contact Us</h1>
            
            <div class="grid-2">
                <div style="background:var(--white); padding:40px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                    <h3 class="mb-4">Get in Touch</h3>
                    
                    <div style="margin-bottom:20px;">
                        <h4 style="color:var(--primary); margin-bottom:5px;">Email</h4>
                        <p>support@rentattire.com</p>
                    </div>
                    <div style="margin-bottom:20px;">
                        <h4 style="color:var(--primary); margin-bottom:5px;">Phone</h4>
                        <p>+94 XX XXX XXXX</p>
                    </div>
                    <div style="margin-bottom:20px;">
                        <h4 style="color:var(--primary); margin-bottom:5px;">Location</h4>
                        <p>123 Fashion Street, Colombo, Sri Lanka</p>
                    </div>
                    <div style="margin-bottom:20px;">
                        <h4 style="color:var(--primary); margin-bottom:5px;">Opening Hours</h4>
                        <p>Monday - Saturday: 9:00 AM - 6:00 PM</p>
                    </div>
                </div>
                
                <div style="background:var(--white); padding:40px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                    <h3 class="mb-4">Send us a Message</h3>
                    <form id="contactForm" onsubmit="return validateContactForm(event)">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Your Email">
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" class="form-control" placeholder="Subject">
                        </div>
                        <div class="form-group mb-4">
                            <label for="message">Message</label>
                            <textarea id="message" class="form-control" rows="5" placeholder="Your Message"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 RentAttire. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
