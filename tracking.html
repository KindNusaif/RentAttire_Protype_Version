<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | Rent Attire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Rent Attire</a>
            <button class="hamburger" id="hamburger">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Collection</a>
                <a href="shops.html">Shops</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="vendor-register.html" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem; box-shadow: none;">List Your Shop</a>
                <a href="cart.html">Cart <span id="cartCount" class="badge badge-available">0</span></a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="section-title text-center">Track Your Rental</h1>
            
            <div class="grid-3">
                <div class="card" style="grid-column: span 1;">
                    <div class="card-body" style="text-align:left;">
                        <h3 class="mb-3">Dashboard</h3>
                        <ul class="footer-links" style="color:var(--text);">
                            <li><a href="account.html" style="color:var(--text);">Profile Information</a></li>
                            <li><a href="history.html" style="color:var(--text);">Rental History</a></li>
                            <li><a href="tracking.html" style="color:var(--primary); font-weight:bold;">Order Tracking</a></li>
                            <li><a href="cart.html" style="color:var(--text);">My Cart</a></li>
                            <li><a href="login.html" style="color:var(--error);">Sign Out</a></li>
                        </ul>
                    </div>
                </div>
                
                <div class="card" style="grid-column: span 2;">
                    <div class="card-body" style="text-align:left;">
                        <h3 class="mb-4">Track Order</h3>
                        
                        <form onsubmit="trackOrder(event)" style="display:flex; gap:10px; margin-bottom:30px;">
                            <input type="text" id="orderId" class="form-control" placeholder="Enter Order ID (e.g., RA1001)">
                            <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Track</button>
                        </form>
                        
                        <div id="trackingResult" style="background:var(--background); padding:20px; border-radius:8px; min-height:200px;">
                            <p class="text-muted">Enter your Order ID above to see the status.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 RentAttire. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
