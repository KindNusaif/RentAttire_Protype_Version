<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentAttire | Vendor Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="vendor-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="" width="30" height="30">
                Vendor Portal
            </a>
            <nav class="nav-links">
                <a href="vendor-dashboard.html" style="color:var(--gold);">Dashboard</a>
                <a href="vendor-products.html">My Products</a>
                <a href="vendor-orders.html">Orders</a>
                <a href="vendor-profile.html">Profile</a>
            </nav>
            <div class="nav-icons">
                <a href="index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">View Store</a>
                <a href="index.html" style="margin-left: 10px;">Logout</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="mb-4">Welcome back, Colombo Silk House</h1>
            
            <div class="grid-3 mb-4">
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Total Earnings</h3>
                    <div style="font-size:2rem; font-weight:bold; color:var(--primary);">Rs. 125,000</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Active Orders</h3>
                    <div style="font-size:2rem; font-weight:bold; color:var(--primary);">3</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Products Listed</h3>
                    <div style="font-size:2rem; font-weight:bold; color:var(--primary);">8</div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
