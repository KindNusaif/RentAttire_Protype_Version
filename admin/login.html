<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentAttire | Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--background);">
    <section class="section" style="min-height: 100vh; display:flex; align-items:center;">
        <div class="container" style="max-width:400px;">
            <div class="text-center mb-4">
                <img src="../images/logo.svg" alt="" width="50" height="50">
                <h1 style="color:var(--primary); font-family:var(--font-heading);">RentAttire Admin</h1>
            </div>
            <div class="card p-4">
                <form onsubmit="event.preventDefault(); alert('Admin Login successful!'); window.location.href='dashboard.html';">
                    <div class="form-group mb-3">
                        <label>Admin Username</label>
                        <input type="text" class="form-control" value="admin" required>
                    </div>
                    <div class="form-group mb-4">
                        <label>Password</label>
                        <input type="password" class="form-control" value="admin123" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Secure Login</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
