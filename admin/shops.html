<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Manage Shops</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="dashboard.html" class="logo">
                <img src="../images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="shops.html" style="color:var(--gold);">Manage Shops</a>
                <a href="orders.html">All Orders</a>
            </nav>
            <div class="nav-icons">
                <a href="../index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">Visit Site</a>
                <a href="login.html" style="margin-left: 10px;">Logout</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="mb-4">Registered Shops</h1>
            <div class="card" style="padding: 0; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="background: #f9f9f9; border-bottom: 2px solid #eee;">
                            <th style="padding: 12px;">Shop ID</th>
                            <th style="padding: 12px;">Shop Name</th>
                            <th style="padding: 12px;">Owner</th>
                            <th style="padding: 12px;">City</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">SH-101</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Colombo Silk House</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Jane Doe</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Colombo</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;"><span class="badge badge-available">Active</span></td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">
                                <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;">Disable</button>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">SH-102</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Kandy Formal Wear</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">John Smith</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Kandy</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;"><span class="badge badge-available">Active</span></td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">
                                <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;">Disable</button>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">SH-103</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Galle Bridal</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Sam Perera</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">Galle</td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;"><span class="badge badge-unavailable">Pending Approval</span></td>
                            <td style="padding: 12px; border-bottom: 1px solid #eee;">
                                <button class="btn btn-primary" style="padding:4px 8px; font-size:12px;">Approve</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="../js/script.js"></script>
</body>
</html>
