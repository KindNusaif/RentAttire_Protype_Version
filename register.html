<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | RentAttire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">RentAttire</a>
            <button class="hamburger" id="hamburger">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Collection</a>
                <a href="shops.html">Shops</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="vendor-register.html" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem; box-shadow: none;">List Your Shop</a>
                <a href="cart.html">Cart <span id="cartCount" class="badge badge-available">0</span></a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div style="max-width:500px; margin:0 auto; background:var(--white); padding:40px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                <h2 class="mb-4 text-center">Create Account</h2>
                
                <form id="registerForm" onsubmit="return validateRegisterForm(event)">
                    <div class="grid-2" style="gap:20px;">
                        <div class="form-group mb-2">
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" class="form-control">
                        </div>
                        <div class="form-group mb-2">
                            <label for="lname">Last Name</label>
                            <input type="text" id="lname" class="form-control">
                        </div>
                    </div>
                    
                    <div class="form-group mb-2">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    
                    <div class="form-group mb-2">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" class="form-control">
                    </div>
                    
                    <div class="form-group mb-2">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control">
                    </div>
                    
                    <div class="form-group mb-4">
                        <label for="cpassword">Confirm Password</label>
                        <input type="password" id="cpassword" class="form-control">
                    </div>
                    
                    <div class="form-group mb-4" style="font-size:14px;">
                        <label style="display:flex; align-items:center; gap:5px; font-weight:normal;">
                            <input type="checkbox" id="terms"> I agree to the <a href="terms.html" style="color:var(--primary);">Terms & Conditions</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
                </form>
                
                <div class="text-center mt-4" style="margin-top:20px; font-size:14px;">
                    Already have an account? <a href="login.html" style="color:var(--primary); font-weight:bold;">Sign In</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 RentAttire. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
