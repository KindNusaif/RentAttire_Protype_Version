<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Vendor Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="vendor-login.html">Vendor Login</a>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container" style="max-width:500px;">
            <div class="text-center mb-4">
                <img src="images/logo-full.svg" alt="Rent Attire" style="height: 48px; margin: 0 auto 16px;">
            </div>
            <div class="card p-4">
                <h2 class="text-center mb-4">List Your Shop</h2>
                <form id="vendorRegisterForm" onsubmit="return validateVendorRegisterForm(event)">
                    <div class="form-group mb-3">
                        <label>Shop Name</label>
                        <input type="text" id="shopName" class="form-control" required>
                    </div>
                    <div class="form-group mb-3">
                        <label>Owner Name</label>
                        <input type="text" id="ownerName" class="form-control" required>
                    </div>
                    <div class="form-group mb-3">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="form-group mb-4">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Register Shop</button>
                    <p class="text-center mt-3 text-muted">Already have a vendor account? <a href="vendor-login.html">Login</a></p>
                </form>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
