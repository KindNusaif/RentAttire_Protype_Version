<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Vendor Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="vendor-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="vendor-dashboard.html">Dashboard</a>
                <a href="vendor-products.html">My Products</a>
                <a href="vendor-orders.html" style="color:var(--gold);">Orders</a>
                <a href="vendor-profile.html">Profile</a>
            </nav>
            <div class="nav-icons">
                <a href="index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">View Store</a>
                <a href="index.html" style="margin-left: 10px;">Logout</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="mb-4">Order Management</h1>
            <div class="card" style="padding: 0; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="background: #f9f9f9; border-bottom: 2px solid #eee;">
                            <th style="padding: 12px;">Order ID</th>
                            <th style="padding: 12px;">Product</th>
                            <th style="padding: 12px;">Customer</th>
                            <th style="padding: 12px;">Dates</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="vendorOrdersBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
